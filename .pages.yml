media:
  input: public/images
  output: /images
content:
- name: pages
  label: Pages
  type: collection
  path: src/data/pages
  format: yaml
  filename: '{primary}.yaml'
  view:
    primary: key
    fields:
    - key
    - slug
    - draft
    sort:
    - key
  fields:
  - name: key
    label: Page ID
    type: string
    required: true
  - name: slug
    label: URL path
    type: string
    required: true
  - name: kind
    label: Kind
    type: select
    options:
      values:
      - name: home
        label: Homepage
      - name: programme
        label: Events index
      - name: content
        label: Content page
    required: true
  - name: theme
    label: Theme
    type: select
    options:
      values:
      - name: paper
        label: Paper
      - name: clay
        label: Terracotta
      - name: moss
        label: Moss
      - name: rose
        label: Rose
      - name: ink
        label: Ink
    required: true
    description: The card and its entire destination page share this colour. Contrast is managed by the
      site.
  - name: draft
    label: Draft / hide in production
    type: boolean
    default: true
  - name: title
    label: Title
    type: object
    fields:
    - name: ja
      label: Japanese (source)
      type: object
      fields:
      - name: text
        label: Title
        type: string
        required: true
    - name: fr
      label: French
      type: object
      fields:
      - name: text
        label: Title
        type: string
    - name: en
      label: English
      type: object
      fields:
      - name: text
        label: Title
        type: string
  - name: description
    label: Description
    type: object
    fields:
    - name: ja
      label: Japanese (source)
      type: object
      fields:
      - name: text
        label: Description
        type: text
    - name: fr
      label: French
      type: object
      fields:
      - name: text
        label: Description
        type: text
    - name: en
      label: English
      type: object
      fields:
      - name: text
        label: Description
        type: text
  - name: translationReview
    label: Translation review
    type: object
    fields:
    - name: fr
      label: Fr
      type: select
      options:
        values:
        - name: draft
          label: Draft / needs review
        - name: reviewed
          label: Reviewed
    - name: en
      label: En
      type: select
      options:
        values:
        - name: draft
          label: Draft / needs review
        - name: reviewed
          label: Reviewed
  - name: sections
    label: Page sections
    type: block
    list:
      collapsible:
        collapsed: true
        summary: '{type} — {index}'
    blockKey: type
    blocks:
    - name: programme
      label: Event board
      fields:
      - name: limit
        label: Number of events
        type: number
        default: 4
        options:
          min: 1
          max: 4
    - name: event_index
      label: Full events index
      fields: []
    - name: rich_text
      label: Text
      fields:
      - name: variant
        label: Variant
        type: select
        options:
          values:
          - name: standard
            label: Standard
          - name: statement
            label: Large statement
      - name: copy
        label: Copy
        type: object
        fields:
        - name: ja
          label: Japanese (source)
          type: object
          fields:
          - name: heading
            label: Heading
            type: string
          - name: body
            label: Body
            type: text
            required: true
            description: Plain text. Blank lines create paragraphs; HTML is not executed.
        - name: fr
          label: French
          type: object
          fields:
          - name: heading
            label: Heading
            type: string
          - name: body
            label: Body
            type: text
            description: Plain text. Blank lines create paragraphs; HTML is not executed.
        - name: en
          label: English
          type: object
          fields:
          - name: heading
            label: Heading
            type: string
          - name: body
            label: Body
            type: text
            description: Plain text. Blank lines create paragraphs; HTML is not executed.
    - name: split
      label: Text and image
      fields:
      - name: image
        label: Image
        type: image
        required: true
      - name: imagePosition
        label: Imageposition
        type: select
        options:
          values:
          - name: left
            label: Left
          - name: right
            label: Right
      - name: copy
        label: Copy
        type: object
        fields:
        - name: ja
          label: Japanese (source)
          type: object
          fields:
          - name: heading
            label: Heading
            type: string
          - name: body
            label: Body
            type: text
            required: true
          - name: imageAlt
            label: Image description
            type: string
            required: true
        - name: fr
          label: French
          type: object
          fields:
          - name: heading
            label: Heading
            type: string
          - name: body
            label: Body
            type: text
          - name: imageAlt
            label: Image description
            type: string
        - name: en
          label: English
          type: object
          fields:
          - name: heading
            label: Heading
            type: string
          - name: body
            label: Body
            type: text
          - name: imageAlt
            label: Image description
            type: string
    - name: gallery
      label: Gallery
      fields:
      - name: copy
        label: Copy
        type: object
        fields:
        - name: ja
          label: Japanese (source)
          type: object
          fields:
          - name: heading
            label: Heading
            type: string
        - name: fr
          label: French
          type: object
          fields:
          - name: heading
            label: Heading
            type: string
        - name: en
          label: English
          type: object
          fields:
          - name: heading
            label: Heading
            type: string
      - name: items
        label: Items
        type: object
        list: true
        fields:
        - name: image
          label: Image
          type: image
          required: true
        - name: copy
          label: Copy
          type: object
          fields:
          - name: ja
            label: Japanese (source)
            type: object
            fields:
            - name: alt
              label: Image description
              type: string
              required: true
            - name: caption
              label: Caption
              type: string
          - name: fr
            label: French
            type: object
            fields:
            - name: alt
              label: Image description
              type: string
            - name: caption
              label: Caption
              type: string
          - name: en
            label: English
            type: object
            fields:
            - name: alt
              label: Image description
              type: string
            - name: caption
              label: Caption
              type: string
    - name: cta
      label: Link
      fields:
      - name: href
        label: Destination
        type: string
        required: true
        description: A local path (e.g. /events/) or a full https:// URL.
      - name: copy
        label: Copy
        type: object
        fields:
        - name: ja
          label: Japanese (source)
          type: object
          fields:
          - name: heading
            label: Heading
            type: string
          - name: body
            label: Body
            type: text
          - name: label
            label: Link label
            type: string
            required: true
        - name: fr
          label: French
          type: object
          fields:
          - name: heading
            label: Heading
            type: string
          - name: body
            label: Body
            type: text
          - name: label
            label: Link label
            type: string
        - name: en
          label: English
          type: object
          fields:
          - name: heading
            label: Heading
            type: string
          - name: body
            label: Body
            type: text
          - name: label
            label: Link label
            type: string
    - name: membership
      label: Membership link
      fields: []
- name: events
  label: Events
  type: collection
  path: src/data/events
  format: yaml
  filename: '{primary}.yaml'
  view:
    primary: slug
    fields:
    - slug
    - start
    - draft
    sort:
    - start
  fields:
  - name: slug
    label: Event ID
    type: string
    required: true
    pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
    description: Stable URL and filename. Do not change after publication.
  - name: draft
    label: Draft / hide in production
    type: boolean
    default: true
  - name: status
    label: Status
    type: select
    options:
      values:
      - name: scheduled
        label: Scheduled
      - name: cancelled
        label: Cancelled
    required: true
  - name: theme
    label: Theme
    type: select
    options:
      values:
      - name: paper
        label: Paper
      - name: clay
        label: Terracotta
      - name: moss
        label: Moss
      - name: rose
        label: Rose
      - name: ink
        label: Ink
    required: true
    description: The card and its entire destination page share this colour. Contrast is managed by the
      site.
  - name: start
    label: Starts
    type: string
    required: true
    description: ISO date/time with offset, e.g. 2026-10-12T18:30:00+02:00. Swiss winter time is +01:00;
      summer is +02:00.
  - name: end
    label: Ends
    type: string
    required: true
    description: Same ISO format, including timezone. Used to determine upcoming vs past.
  - name: location
    label: Location
    type: string
    required: true
  - name: registrationUrl
    label: Registration URL
    type: string
    description: Leave empty until confirmed. Only https:// URLs are accepted.
  - name: image
    label: Image
    type: image
  - name: imageIllustration
    label: Image is illustrative, not documentary
    type: boolean
    default: false
  - name: translationReview
    label: Translation review
    type: object
    fields:
    - name: fr
      label: Fr
      type: select
      options:
        values:
        - name: draft
          label: Draft / needs review
        - name: reviewed
          label: Reviewed
    - name: en
      label: En
      type: select
      options:
        values:
        - name: draft
          label: Draft / needs review
        - name: reviewed
          label: Reviewed
  - name: copy
    label: Copy
    type: object
    fields:
    - name: ja
      label: Japanese (source)
      type: object
      fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: body
        label: Description
        type: text
        required: true
      - name: imageAlt
        label: Image description
        type: string
    - name: fr
      label: French
      type: object
      fields:
      - name: title
        label: Title
        type: string
      - name: body
        label: Description
        type: text
      - name: imageAlt
        label: Image description
        type: string
    - name: en
      label: English
      type: object
      fields:
      - name: title
        label: Title
        type: string
      - name: body
        label: Description
        type: text
      - name: imageAlt
        label: Image description
        type: string
- name: site
  label: Site settings
  type: file
  path: src/data/site.json
  format: json
  fields:
  - name: name
    label: Association name
    type: string
    required: true
  - name: url
    label: Canonical website URL
    type: string
    required: true
  - name: mastheadJa
    label: Japanese masthead
    type: string
    required: true
  - name: logo
    label: Official LNC logo
    type: image
    description: Displayed unchanged. Leave empty until the official asset is supplied.
  - name: email
    label: Contact email
    type: string
  - name: instagramUrl
    label: Instagram URL
    type: string
  - name: joinUrl
    label: Membership URL
    type: string
  - name: socialImage
    label: Social preview image
    type: image
  - name: photo
    label: Main photograph
    type: image
  - name: detailPhoto
    label: Detail photograph
    type: image
  - name: photoIllustration
    label: Photographs are illustrative
    type: boolean
  - name: photoAlt
    label: Main photograph descriptions
    type: object
    fields:
    - name: ja
      label: Ja
      type: string
    - name: fr
      label: Fr
      type: string
    - name: en
      label: En
      type: string
  - name: detailPhotoAlt
    label: Detail photograph descriptions
    type: object
    fields:
    - name: ja
      label: Ja
      type: string
    - name: fr
      label: Fr
      type: string
    - name: en
      label: En
      type: string
