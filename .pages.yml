media:
  input: public/images
  output: /images
content:
- name: pages
  label: Pages
  type: collection
  path: src/data/pages
  format: yaml
  filename: '{primary}.yaml'
  view:
    primary: key
    fields:
    - key
    - slug
    sort:
    - key
    - slug
  fields:
  - name: key
    label: Internal page ID
    type: string
    required: true
    description: Used as the filename. Keep it short, e.g. home or about.
  - name: slug
    label: URL path
    type: string
    required: true
    description: Use / for home, /about for About, etc.
  - name: title
    label: Page title
    type: object
    fields:
    - name: ja
      label: Japanese (source)
      type: object
      fields:
      - name: text
        label: Title
        type: string
        required: true
    - name: fr
      label: French
      type: object
      fields:
      - name: text
        label: Title
        type: string
    - name: en
      label: English
      type: object
      fields:
      - name: text
        label: Title
        type: string
  - name: description
    label: SEO description
    type: object
    fields:
    - name: ja
      label: Japanese (source)
      type: object
      fields:
      - name: text
        label: Description
        type: text
    - name: fr
      label: French
      type: object
      fields:
      - name: text
        label: Description
        type: text
    - name: en
      label: English
      type: object
      fields:
      - name: text
        label: Description
        type: text
  - name: translationReview
    label: Translation review
    type: object
    fields:
    - name: fr
      label: French
      type: select
      options:
        values:
        - name: draft
          label: Draft / needs review
        - name: reviewed
          label: Reviewed
    - name: en
      label: English
      type: select
      options:
        values:
        - name: draft
          label: Draft / needs review
        - name: reviewed
          label: Reviewed
  - name: sections
    label: Sections
    type: block
    list:
      collapsible:
        collapsed: true
        summary: '{type} — {index}'
      min: 1
    blockKey: type
    blocks:
    - name: newspaper
      label: Newspaper edition
      fields:
      - name: id
        label: Edition ID
        type: string
        required: true
        pattern: ^[a-z0-9-]+$
        description: Stable part of article URLs. Use e.g. front. Do not change this after publishing.
      - name: issue
        label: Issue number
        type: string
        required: true
        description: Text, e.g. 001. Keeps leading zeroes.
      - name: date
        label: Publication date
        type: string
        required: true
        pattern: ^\d{4}-\d{2}-\d{2}$
        description: YYYY-MM-DD. This is an editorial publication date, not a live clock.
      - name: logo
        label: Official LNC logo
        type: image
        description: Displayed unchanged inside the publisher box. Leave empty to show plain LNC initials.
      - name: copy
        label: Copy
        type: object
        fields:
        - name: ja
          label: Japanese (source)
          type: object
          fields:
          - name: masthead
            label: Newspaper name (line breaks allowed)
            type: text
            required: true
          - name: subtitle
            label: Line beneath the masthead
            type: string
          - name: season
            label: Issue subtitle / season
            type: string
          - name: edition
            label: Edition label
            type: string
          - name: publisherName
            label: Publisher name (line breaks allowed)
            type: text
          - name: publisherNote
            label: Publisher’s short note
            type: text
          - name: railLabel
            label: Accessible sidebar label
            type: string
          - name: bottomLabel
            label: Accessible notices label
            type: string
          - name: colophon
            label: Colophon / production credit
            type: text
        - name: fr
          label: French
          type: object
          fields:
          - name: masthead
            label: Newspaper name (line breaks allowed)
            type: text
          - name: subtitle
            label: Line beneath the masthead
            type: string
          - name: season
            label: Issue subtitle / season
            type: string
          - name: edition
            label: Edition label
            type: string
          - name: publisherName
            label: Publisher name (line breaks allowed)
            type: text
          - name: publisherNote
            label: Publisher’s short note
            type: text
          - name: railLabel
            label: Accessible sidebar label
            type: string
          - name: bottomLabel
            label: Accessible notices label
            type: string
          - name: colophon
            label: Colophon / production credit
            type: text
        - name: en
          label: English
          type: object
          fields:
          - name: masthead
            label: Newspaper name (line breaks allowed)
            type: text
          - name: subtitle
            label: Line beneath the masthead
            type: string
          - name: season
            label: Issue subtitle / season
            type: string
          - name: edition
            label: Edition label
            type: string
          - name: publisherName
            label: Publisher name (line breaks allowed)
            type: text
          - name: publisherNote
            label: Publisher’s short note
            type: text
          - name: railLabel
            label: Accessible sidebar label
            type: string
          - name: bottomLabel
            label: Accessible notices label
            type: string
          - name: colophon
            label: Colophon / production credit
            type: text
      - name: stories
        label: Stories / page composition
        type: object
        list:
          collapsible:
            collapsed: true
            summary: '{id} — {kind}'
        description: Drag to reorder within each area. Main columns total 12; the sidebar stacks; bottom
          notices use another 12-column grid.
        fields:
        - name: id
          label: Story ID
          type: string
          required: true
          pattern: ^[a-z0-9-]+$
          description: Unique within this edition; forms the full article URL.
        - name: area
          label: Placement
          type: select
          options:
            values:
            - name: main
              label: Main newspaper
            - name: rail
              label: Right sidebar
            - name: bottom
              label: Bottom notices
        - name: kind
          label: Headline treatment
          type: select
          options:
            values:
            - name: article
              label: Editorial article
            - name: poster
              label: Large vertical / display headline
            - name: lead
              label: Full-width main headline
            - name: brief
              label: Short notice
        - name: span
          label: Columns (1–12)
          type: number
          description: Use 3 for a quarter row, 4 for a third, 6 for a half, 9 for three quarters, 12
            for full width. Ignored in the sidebar; mobile reflows automatically.
        - name: tone
          label: Headline background
          type: select
          options:
            values:
            - name: paper
              label: Dark ink on paper
            - name: ink
              label: Paper lettering on dark ink
        - name: placeholder
          label: Specimen article
          type: boolean
          description: Shows a placeholder warning and prevents search-engine indexing. Blank bodies use
            locale-specific filler only while this is on. Turn off before publishing real copy.
        - name: image
          label: Optional image
          type: image
        - name: href
          label: Optional action link
          type: string
          description: Appears on the full article. Use an internal path or an https/mailto URL. Leave
            blank to omit.
        - name: copy
          label: Copy
          type: object
          fields:
          - name: ja
            label: Japanese (source)
            type: object
            fields:
            - name: title
              label: Headline (line breaks allowed)
              type: text
              required: true
            - name: label
              label: Department / category
              type: string
            - name: deck
              label: Short introduction
              type: text
            - name: body
              label: Full article
              type: text
              description: Plain text. Use blank lines for paragraphs. For specimen articles only, a blank
                body uses Japanese or Latin-script filler.
            - name: meta
              label: Short metadata (optional)
              type: string
            - name: byline
              label: Byline (optional)
              type: string
            - name: imageAlt
              label: Image description
              type: string
            - name: action
              label: Optional action link label
              type: string
          - name: fr
            label: French
            type: object
            fields:
            - name: title
              label: Headline (line breaks allowed)
              type: text
            - name: label
              label: Department / category
              type: string
            - name: deck
              label: Short introduction
              type: text
            - name: body
              label: Full article
              type: text
              description: Plain text. Use blank lines for paragraphs. For specimen articles only, a blank
                body uses Japanese or Latin-script filler.
            - name: meta
              label: Short metadata (optional)
              type: string
            - name: byline
              label: Byline (optional)
              type: string
            - name: imageAlt
              label: Image description
              type: string
            - name: action
              label: Optional action link label
              type: string
          - name: en
            label: English
            type: object
            fields:
            - name: title
              label: Headline (line breaks allowed)
              type: text
            - name: label
              label: Department / category
              type: string
            - name: deck
              label: Short introduction
              type: text
            - name: body
              label: Full article
              type: text
              description: Plain text. Use blank lines for paragraphs. For specimen articles only, a blank
                body uses Japanese or Latin-script filler.
            - name: meta
              label: Short metadata (optional)
              type: string
            - name: byline
              label: Byline (optional)
              type: string
            - name: imageAlt
              label: Image description
              type: string
            - name: action
              label: Optional action link label
              type: string
    - name: hero
      label: Hero
      fields:
      - name: layout
        label: Layout
        type: select
        options:
          values:
          - name: default
            label: Default
          - name: center
            label: Center
      - name: image
        label: Image
        type: image
      - name: copy
        label: Copy
        type: object
        fields:
        - name: ja
          label: Japanese (source)
          type: object
          fields:
          - name: eyebrow
            label: Eyebrow
            type: string
          - name: heading
            label: Heading
            type: string
            required: true
          - name: subheading
            label: Subheading
            type: text
        - name: fr
          label: French
          type: object
          fields:
          - name: eyebrow
            label: Eyebrow
            type: string
          - name: heading
            label: Heading
            type: string
          - name: subheading
            label: Subheading
            type: text
        - name: en
          label: English
          type: object
          fields:
          - name: eyebrow
            label: Eyebrow
            type: string
          - name: heading
            label: Heading
            type: string
          - name: subheading
            label: Subheading
            type: text
    - name: rich_text
      label: Rich text
      fields:
      - name: variant
        label: Variant
        type: select
        options:
          values:
          - name: standard
            label: Standard
          - name: statement
            label: Statement
      - name: copy
        label: Copy
        type: object
        fields:
        - name: ja
          label: Japanese (source)
          type: object
          fields:
          - name: heading
            label: Heading
            type: string
          - name: body
            label: Content
            type: rich-text
            required: true
            options:
              format: html
              switcher: false
        - name: fr
          label: French
          type: object
          fields:
          - name: heading
            label: Heading
            type: string
          - name: body
            label: Content
            type: rich-text
            options:
              format: html
              switcher: false
        - name: en
          label: English
          type: object
          fields:
          - name: heading
            label: Heading
            type: string
          - name: body
            label: Content
            type: rich-text
            options:
              format: html
              switcher: false
    - name: split
      label: Text + image
      fields:
      - name: image
        label: Image
        type: image
        required: true
      - name: imagePosition
        label: Image position
        type: select
        options:
          values:
          - name: left
            label: Left
          - name: right
            label: Right
      - name: copy
        label: Copy
        type: object
        fields:
        - name: ja
          label: Japanese (source)
          type: object
          fields:
          - name: heading
            label: Heading
            type: string
            required: true
          - name: body
            label: Content
            type: rich-text
            required: true
            options:
              format: html
              switcher: false
          - name: imageAlt
            label: Image description
            type: string
        - name: fr
          label: French
          type: object
          fields:
          - name: heading
            label: Heading
            type: string
          - name: body
            label: Content
            type: rich-text
            options:
              format: html
              switcher: false
          - name: imageAlt
            label: Image description
            type: string
        - name: en
          label: English
          type: object
          fields:
          - name: heading
            label: Heading
            type: string
          - name: body
            label: Content
            type: rich-text
            options:
              format: html
              switcher: false
          - name: imageAlt
            label: Image description
            type: string
    - name: gallery
      label: Gallery
      fields:
      - name: copy
        label: Copy
        type: object
        fields:
        - name: ja
          label: Japanese (source)
          type: object
          fields:
          - name: heading
            label: Heading
            type: string
        - name: fr
          label: French
          type: object
          fields:
          - name: heading
            label: Heading
            type: string
        - name: en
          label: English
          type: object
          fields:
          - name: heading
            label: Heading
            type: string
      - name: items
        label: Images
        type: object
        list:
          collapsible:
            collapsed: true
            summary: Image {index}
          min: 1
        fields:
        - name: image
          label: Image
          type: image
          required: true
        - name: copy
          label: Copy
          type: object
          fields:
          - name: ja
            label: Japanese (source)
            type: object
            fields:
            - name: alt
              label: Image description
              type: string
            - name: caption
              label: Caption
              type: string
          - name: fr
            label: French
            type: object
            fields:
            - name: alt
              label: Image description
              type: string
            - name: caption
              label: Caption
              type: string
          - name: en
            label: English
            type: object
            fields:
            - name: alt
              label: Image description
              type: string
            - name: caption
              label: Caption
              type: string
    - name: cta
      label: Call to action
      fields:
      - name: href
        label: Link
        type: string
        required: true
      - name: copy
        label: Copy
        type: object
        fields:
        - name: ja
          label: Japanese (source)
          type: object
          fields:
          - name: heading
            label: Heading
            type: string
            required: true
          - name: body
            label: Text
            type: text
          - name: label
            label: Button label
            type: string
            required: true
        - name: fr
          label: French
          type: object
          fields:
          - name: heading
            label: Heading
            type: string
          - name: body
            label: Text
            type: text
          - name: label
            label: Button label
            type: string
        - name: en
          label: English
          type: object
          fields:
          - name: heading
            label: Heading
            type: string
          - name: body
            label: Text
            type: text
          - name: label
            label: Button label
            type: string
- name: site
  label: Site settings
  type: file
  path: src/data/site.json
  format: json
  fields:
  - name: name
    label: Association name
    type: string
    required: true
  - name: description
    label: Default SEO description
    type: text
  - name: navigation
    label: Navigation
    type: object
    list:
      collapsible:
        collapsed: true
        summary: '{href}'
    fields:
    - name: href
      label: Link
      type: string
      required: true
    - name: label
      label: Label
      type: object
      fields:
      - name: ja
        label: Japanese
        type: string
        required: true
      - name: fr
        label: French
        type: string
        required: true
      - name: en
        label: English
        type: string
        required: true
