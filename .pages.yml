media:
  input: public/images
  output: /images

content:
  - name: pages
    label: Pages
    type: collection
    path: src/data/pages
    format: yaml
    filename: "{primary}.yaml"

    view:
      primary: key
      fields: [key, slug]
      sort: [key, slug]

    fields:
      - name: key
        label: Internal page ID
        type: string
        required: true
        description: Used as the filename. Keep it short, e.g. home or about.

      - name: slug
        label: URL path
        type: string
        required: true
        description: Use / for home, /about for About, etc.

      - name: title
        label: Page title
        type: object
        fields:
          - name: ja
            label: Japanese (source)
            type: object
            fields:
              - name: text
                label: Title
                type: string
                required: true
          - name: fr
            label: French
            type: object
            fields:
              - name: text
                label: Title
                type: string
          - name: en
            label: English
            type: object
            fields:
              - name: text
                label: Title
                type: string

      - name: description
        label: SEO description
        type: object
        fields:
          - name: ja
            label: Japanese (source)
            type: object
            fields:
              - name: text
                label: Description
                type: text
          - name: fr
            label: French
            type: object
            fields:
              - name: text
                label: Description
                type: text
          - name: en
            label: English
            type: object
            fields:
              - name: text
                label: Description
                type: text

      - name: translationReview
        label: Translation review
        type: object
        fields:
          - name: fr
            label: French
            type: select
            options:
              values:
                - name: draft
                  label: AI draft / needs review
                - name: reviewed
                  label: Reviewed
          - name: en
            label: English
            type: select
            options:
              values:
                - name: draft
                  label: AI draft / needs review
                - name: reviewed
                  label: Reviewed

      - name: sections
        label: Sections
        type: block
        list:
          min: 1
          collapsible:
            collapsed: true
            summary: "{type} — {index}"
        blockKey: type

        blocks:
          - name: hero
            label: Hero
            fields:
              - name: layout
                label: Layout
                type: select
                options:
                  values:
                    - name: default
                      label: Default
                    - name: center
                      label: Center
              - name: image
                label: Image
                type: image
              - name: copy
                label: Copy
                type: object
                fields:
                  - name: ja
                    label: Japanese (source)
                    type: object
                    fields:
                      - name: eyebrow
                        label: Eyebrow
                        type: string
                      - name: heading
                        label: Heading
                        type: string
                        required: true
                      - name: subheading
                        label: Subheading
                        type: text
                  - name: fr
                    label: French
                    type: object
                    fields:
                      - name: eyebrow
                        label: Eyebrow
                        type: string
                      - name: heading
                        label: Heading
                        type: string
                      - name: subheading
                        label: Subheading
                        type: text
                  - name: en
                    label: English
                    type: object
                    fields:
                      - name: eyebrow
                        label: Eyebrow
                        type: string
                      - name: heading
                        label: Heading
                        type: string
                      - name: subheading
                        label: Subheading
                        type: text

          - name: rich_text
            label: Rich text
            fields:
              - name: variant
                label: Variant
                type: select
                options:
                  values:
                    - name: standard
                      label: Standard
                    - name: statement
                      label: Statement
              - name: copy
                label: Copy
                type: object
                fields:
                  - name: ja
                    label: Japanese (source)
                    type: object
                    fields:
                      - name: heading
                        label: Heading
                        type: string
                      - name: body
                        label: Content
                        type: rich-text
                        required: true
                        options:
                          format: html
                          switcher: false
                  - name: fr
                    label: French
                    type: object
                    fields:
                      - name: heading
                        label: Heading
                        type: string
                      - name: body
                        label: Content
                        type: rich-text
                        options:
                          format: html
                          switcher: false
                  - name: en
                    label: English
                    type: object
                    fields:
                      - name: heading
                        label: Heading
                        type: string
                      - name: body
                        label: Content
                        type: rich-text
                        options:
                          format: html
                          switcher: false

          - name: split
            label: Text + image
            fields:
              - name: image
                label: Image
                type: image
                required: true
              - name: imagePosition
                label: Image position
                type: select
                options:
                  values:
                    - name: left
                      label: Left
                    - name: right
                      label: Right
              - name: copy
                label: Copy
                type: object
                fields:
                  - name: ja
                    label: Japanese (source)
                    type: object
                    fields:
                      - name: heading
                        label: Heading
                        type: string
                        required: true
                      - name: body
                        label: Content
                        type: rich-text
                        required: true
                        options:
                          format: html
                          switcher: false
                      - name: imageAlt
                        label: Image description
                        type: string
                  - name: fr
                    label: French
                    type: object
                    fields:
                      - name: heading
                        label: Heading
                        type: string
                      - name: body
                        label: Content
                        type: rich-text
                        options:
                          format: html
                          switcher: false
                      - name: imageAlt
                        label: Image description
                        type: string
                  - name: en
                    label: English
                    type: object
                    fields:
                      - name: heading
                        label: Heading
                        type: string
                      - name: body
                        label: Content
                        type: rich-text
                        options:
                          format: html
                          switcher: false
                      - name: imageAlt
                        label: Image description
                        type: string

          - name: gallery
            label: Gallery
            fields:
              - name: copy
                label: Copy
                type: object
                fields:
                  - name: ja
                    label: Japanese (source)
                    type: object
                    fields:
                      - name: heading
                        label: Heading
                        type: string
                  - name: fr
                    label: French
                    type: object
                    fields:
                      - name: heading
                        label: Heading
                        type: string
                  - name: en
                    label: English
                    type: object
                    fields:
                      - name: heading
                        label: Heading
                        type: string
              - name: items
                label: Images
                type: object
                list:
                  min: 1
                  collapsible:
                    collapsed: true
                    summary: "Image {index}"
                fields:
                  - name: image
                    label: Image
                    type: image
                    required: true
                  - name: copy
                    label: Copy
                    type: object
                    fields:
                      - name: ja
                        label: Japanese (source)
                        type: object
                        fields:
                          - name: alt
                            label: Image description
                            type: string
                          - name: caption
                            label: Caption
                            type: string
                      - name: fr
                        label: French
                        type: object
                        fields:
                          - name: alt
                            label: Image description
                            type: string
                          - name: caption
                            label: Caption
                            type: string
                      - name: en
                        label: English
                        type: object
                        fields:
                          - name: alt
                            label: Image description
                            type: string
                          - name: caption
                            label: Caption
                            type: string

          - name: cta
            label: Call to action
            fields:
              - name: href
                label: Link
                type: string
                required: true
              - name: copy
                label: Copy
                type: object
                fields:
                  - name: ja
                    label: Japanese (source)
                    type: object
                    fields:
                      - name: heading
                        label: Heading
                        type: string
                        required: true
                      - name: body
                        label: Text
                        type: text
                      - name: label
                        label: Button label
                        type: string
                        required: true
                  - name: fr
                    label: French
                    type: object
                    fields:
                      - name: heading
                        label: Heading
                        type: string
                      - name: body
                        label: Text
                        type: text
                      - name: label
                        label: Button label
                        type: string
                  - name: en
                    label: English
                    type: object
                    fields:
                      - name: heading
                        label: Heading
                        type: string
                      - name: body
                        label: Text
                        type: text
                      - name: label
                        label: Button label
                        type: string

  - name: site
    label: Site settings
    type: file
    path: src/data/site.json
    format: json
    fields:
      - name: name
        label: Association name
        type: string
        required: true
      - name: description
        label: Default SEO description
        type: text
      - name: navigation
        label: Navigation
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{href}"
        fields:
          - name: href
            label: Link
            type: string
            required: true
          - name: label
            label: Label
            type: object
            fields:
              - name: ja
                label: Japanese
                type: string
                required: true
              - name: fr
                label: French
                type: string
                required: true
              - name: en
                label: English
                type: string
                required: true
