media:
  input: public/images
  output: /images

content:
  - name: pages
    label: Pages
    type: collection
    path: src/data/pages
    format: yaml
    filename: "{primary}.yaml"
    view:
      primary: title
      fields: [title, slug]
      sort: [title, slug]
    fields:
      - name: title
        label: Page title
        type: string
        required: true
      - name: slug
        label: URL path
        type: string
        required: true
        description: Use / for the home page, /about for About, etc.
      - name: description
        label: SEO description
        type: text
      - name: sections
        label: Sections
        type: block
        list:
          min: 1
          collapsible:
            collapsed: true
            summary: "{type} — {index}"
        blockKey: type
        blocks:
          - name: hero
            label: Hero
            fields:
              - name: eyebrow
                label: Eyebrow
                type: string
              - name: heading
                label: Heading
                type: string
                required: true
              - name: subheading
                label: Subheading
                type: text
              - name: image
                label: Background image
                type: image
              - name: layout
                label: Alignment
                type: select
                options:
                  values:
                    - name: left
                      label: Left
                    - name: center
                      label: Center
          - name: rich_text
            label: Rich text
            fields:
              - name: heading
                label: Heading
                type: string
              - name: variant
                label: Scale
                type: select
                options:
                  values:
                    - name: standard
                      label: Standard
                    - name: statement
                      label: Statement
              - name: body
                label: Content
                type: rich-text
                required: true
                options:
                  format: html
                  switcher: false
          - name: split
            label: Text + image
            fields:
              - name: heading
                label: Heading
                type: string
                required: true
              - name: body
                label: Content
                type: rich-text
                required: true
                options:
                  format: html
                  switcher: false
              - name: image
                label: Image
                type: image
                required: true
              - name: imageAlt
                label: Image description (accessibility)
                type: string
              - name: imagePosition
                label: Image position
                type: select
                options:
                  values:
                    - name: left
                      label: Left
                    - name: right
                      label: Right
          - name: gallery
            label: Gallery
            fields:
              - name: heading
                label: Heading
                type: string
              - name: items
                label: Images
                type: object
                list:
                  min: 1
                  collapsible:
                    collapsed: true
                    summary: "Image {index}"
                fields:
                  - name: image
                    label: Image
                    type: image
                    required: true
                  - name: alt
                    label: Image description (accessibility)
                    type: string
                  - name: caption
                    label: Caption
                    type: string
          - name: cta
            label: Call to action
            fields:
              - name: heading
                label: Heading
                type: string
                required: true
              - name: body
                label: Text
                type: text
              - name: link
                label: Button
                type: object
                required: true
                fields:
                  - name: label
                    label: Button label
                    type: string
                    required: true
                  - name: href
                    label: Link
                    type: string
                    required: true

  - name: site
    label: Site settings
    type: file
    path: src/data/site.json
    format: json
    fields:
      - name: name
        label: Association name
        type: string
        required: true
      - name: description
        label: Default SEO description
        type: text
      - name: navigation
        label: Navigation
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{label}"
        fields:
          - name: label
            label: Label
            type: string
            required: true
          - name: href
            label: Link
            type: string
            required: true
